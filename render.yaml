services:
  - type: web
    name: automod-fb-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: FB_VERIFY_TOKEN
        value: automod_fb_secret_token_2026
      - key: GEMINI_API_KEY
        sync: false
